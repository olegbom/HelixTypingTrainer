theme = "base16_transparent"

[editor]
line-number = "relative"
cursorline = false
cursor-shape.normal = "bar"
cursor-shape.insert = "bar"
cursor-shape.select = "bar"
soft-wrap.enable = true
gutters = []
shell = ["pwsh", "-nop", "-nol", "-noni", "-of", "Text", "-c"]
# shell = ["cmd", "/C"] 
auto-pairs = false
# lsp.display-inlay-hints = true

[editor.whitespace.render]
space = "all"
tab = "all"
nbsp = "all"
nnbsp = "all"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"
tabpad = "·" # Tabs will look like "→···" (depending on tab width)

[keys.normal.space]
D = [ ":w",
      ":! .\\close_typing_wezterms.ps1 %{buffer_name}",
      ":! git diff --no-index ('%{buffer_name}'.Substring(0, '%{buffer_name}'.Length - 9)) %{buffer_name}; exit 0" ]
